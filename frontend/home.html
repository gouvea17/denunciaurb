<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Denuncia+</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .dashboard {
            margin-top: 80px;
            padding: 2rem 10%;
        }
        
        .welcome-section {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .welcome-section h1 {
            font-size: 2rem;
            color: #333;
        }
        
        .welcome-section span {
            color: #e74c3c;
        }
        
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .info-card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .info-card:hover {
            transform: translateY(-5px);
        }
        
        .info-card i {
            font-size: 3rem;
            color: #e74c3c;
            margin-bottom: 1rem;
        }
        
        .user-name {
            color: #e74c3c;
            font-weight: 600;
        }
        
        .btn-denuncia {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .btn-denuncia:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-exclamation-triangle"></i>
                <span>Denuncia+</span>
            </div>
            <div class="nav-links">
                <span id="userNome" class="user-name"></span>
                <button onclick="logout()" class="btn-login">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </div>
    </nav>

    <div class="dashboard">
        <div class="welcome-section">
            <h1>Olá, <span id="welcomeNome"></span>!</h1>
            <p>Bem-vindo à plataforma de denúncias urbanas</p>
            <p style="margin-top: 1rem; font-size: 1.1rem;">Sua participação é fundamental para uma cidade melhor!</p>
        </div>

        <div class="dashboard-cards">
            <div class="info-card">
                <i class="fas fa-bullhorn"></i>
                <h3>Faça uma Denúncia</h3>
                <p>Registre problemas urbanos da sua cidade</p>
                <button class="btn-denuncia" style="margin-top: 1rem;" onclick="alert('Em breve você poderá fazer denúncias!')">
                    Nova Denúncia
                </button>
            </div>
            
            <div class="info-card">
                <i class="fas fa-chart-line"></i>
                <h3>Acompanhe</h3>
                <p>Monitore o status das suas denúncias</p>
                <p style="margin-top: 1rem; color: #666;">Em breve</p>
            </div>
            
            <div class="info-card">
                <i class="fas fa-trophy"></i>
                <h3>Ranking</h3>
                <p>Veja os cidadãos mais ativos</p>
                <p style="margin-top: 1rem; color: #666;">Em breve</p>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
